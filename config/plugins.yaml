plugins:
  fetchers:
    - name: rss-fetcher
      enabled: true
      config:
        timeout: 15000
        maxItemsPerFeed: 5
  transformers:
    - name: pii-redactor
      enabled: true
      config:
        redactEmails: true
        redactPhones: true
    - name: summarizer
      enabled: false
      config:
        maxLength: 200
        style: paragraph
  outputs:
    - name: telegram
      source: builtin
      enabled: true
      config: {}
