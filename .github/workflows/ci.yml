name: CI

on:
  push:
    branches: [main, develop]
    tags: ['v*']
  pull_request:
    branches: [main, develop]

jobs:
  test:
    name: Test, Lint, Typecheck
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          # Docker runs node:24-alpine, so CI tests the same line. Node 20 is
          # not supported by better-sqlite3@13 (needs N-API 10) and segfaults.
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Install frontend dependencies
        run: cd frontend && npm ci

      - name: TypeScript typecheck
        run: npm run typecheck

      - name: Biome lint
        run: npm run lint

      # O teste GET / serve public/index.html; sem o build ele falha (e o
      # job de testes passaria a validar só parte da aplicação).
      - name: Build frontend
        run: npm run build:frontend

      - name: Run tests
        run: npm test

  build-frontend:
    name: Build Frontend
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          # Docker runs node:24-alpine, so CI tests the same line. Node 20 is
          # not supported by better-sqlite3@13 (needs N-API 10) and segfaults.
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies
        run: cd frontend && npm ci

      - name: Build frontend
        run: cd frontend && npm run build

  build-docker:
    name: Build Docker Image
    runs-on: ubuntu-latest
    needs: [test, build-frontend]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: false
          tags: rss-news-hub:test
          load: true

      - name: Test container startup
        run: |
          docker run --rm -d --name test-container \
            -e NODE_ENV=production \
            -e JWT_SECRET=testsecret12345678901234567890123456789012345678901234 \
            -e DEEPSEEK_API_KEY=dummy-key-for-test \
            -e TELEGRAM_BOT_TOKEN=dummy-token \
            -e TELEGRAM_CHAT_ID=123456789 \
            -p 3000:3000 \
            rss-news-hub:test
          sleep 10
          curl -f http://localhost:3000/health || (docker logs test-container && exit 1)
          docker stop test-container

  release:
    name: Create Release
    runs-on: ubuntu-latest
    needs: [test, build-frontend, build-docker]
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract version
        id: version
        run: echo "VERSION=${GITHUB_REF#refs/tags/v}" >> $GITHUB_OUTPUT

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: |
            ghcr.io/t3lo5/${{ github.event.repository.name }}:${{ steps.version.outputs.VERSION }}
            ghcr.io/t3lo5/${{ github.event.repository.name }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v1
        with:
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}